apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  yas.server: |
    yas.local.com:53 {
        errors
        cache 30
        hosts {
            10.43.159.25 identity.yas.local.com identity.yas.local
            10.43.218.75 storefront.yas.local.com storefront.yas.local
            10.43.137.46 backoffice.yas.local.com backoffice.yas.local
            fallthrough
        }
        forward . /etc/resolv.conf
    }
