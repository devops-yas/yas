apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry
spec:
  image: otel/opentelemetry-collector-contrib:0.98.0
  mode: deployment
  ports:
    - name: loki
      port: 3500
      protocol: TCP
      targetPort: 3500
  config:
    {{ toYaml .Values.opentelemetryCollectorConfig | nindent 4 }}